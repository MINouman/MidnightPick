# Midnight Pick — PostgreSQL tuning for a 1 GB / 1 vCPU droplet
# ---------------------------------------------------------------
# Install: copy this file to the conf.d directory so it overrides the
# defaults without editing the main postgresql.conf:
#
#   sudo cp deploy/postgresql-tuning.conf /etc/postgresql/*/main/conf.d/zz-midnightpick.conf
#   sudo systemctl restart postgresql
#
# (If your install has no conf.d/, append these lines to the bottom of
#  /etc/postgresql/<version>/main/postgresql.conf instead.)

# Memory — kept small so Postgres co-exists with Redis + Node + nginx on 1 GB.
shared_buffers = 128MB              # ~25% of a 512MB budget for PG; safe on 1 GB
effective_cache_size = 512MB        # planner hint only (not allocated)
work_mem = 4MB                      # per sort/hash; 20 conns * a few = bounded
maintenance_work_mem = 64MB         # vacuum / index builds

# Connections — your app pool maxes at 10; 20 leaves room for migrations/psql.
max_connections = 20

# SSD-friendly planner settings (DigitalOcean volumes are SSD).
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL / checkpoints — gentle on a small disk.
wal_buffers = 4MB
checkpoint_completion_target = 0.9
min_wal_size = 256MB
max_wal_size = 1GB

# Log slow queries (>1s) so you can spot problems early.
log_min_duration_statement = 1000
