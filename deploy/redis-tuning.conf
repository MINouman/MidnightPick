# Midnight Pick — Redis tuning for a 1 GB / 1 vCPU droplet
# ---------------------------------------------------------------
# Redis here only holds short-lived, TTL'd data: OTP rate-limit counters,
# the API rate-limiter, and the access-token blacklist. None of it needs to
# survive a reboot, so we cap memory and keep persistence light.
#
# Install: append these to /etc/redis/redis.conf (or drop in a conf.d include),
# then restart:
#
#   sudo bash -c 'cat deploy/redis-tuning.conf >> /etc/redis/redis.conf'
#   sudo systemctl restart redis-server
#
# IMPORTANT: confirm these defaults are already set in redis.conf (they are on a
# fresh Ubuntu install) so Redis is NOT reachable from the internet:
#   bind 127.0.0.1 ::1
#   protected-mode yes

# Hard memory cap — Redis will never starve Postgres/Node.
maxmemory 64mb

# Evict least-recently-used keys when the cap is hit. Everything we store has a
# TTL and is non-critical (a lost rate-limit counter just resets; a lost
# blacklist entry lets a revoked token live out its ≤15-min expiry).
maxmemory-policy allkeys-lru
