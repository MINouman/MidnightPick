# Midnight Pick — nginx site config (Cloudflare in front)
# ---------------------------------------------------------------
# Place at:  /etc/nginx/sites-available/midnightpick
# Enable:    sudo ln -s /etc/nginx/sites-available/midnightpick /etc/nginx/sites-enabled/
#            sudo rm -f /etc/nginx/sites-enabled/default      # remove the default site
#            sudo nginx -t && sudo systemctl reload nginx
#
# TLS is a Cloudflare ORIGIN CERTIFICATE (free, 15-year, generated in the
# Cloudflare dashboard → SSL/TLS → Origin Server → Create Certificate).
# Save the two files it gives you on the server as:
#   /etc/ssl/cloudflare/midnightpick.pem   (the certificate)
#   /etc/ssl/cloudflare/midnightpick.key   (the private key — chmod 600)
# Then set Cloudflare SSL/TLS mode to "Full (strict)".
#
# Replace yourdomain.com below with your real domain.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;     # push everything to HTTPS
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate     /etc/ssl/cloudflare/midnightpick.pem;
    ssl_certificate_key /etc/ssl/cloudflare/midnightpick.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Belt-and-suspenders headers (the app also sets these via @fastify/helmet).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Upload size must match the backend bodyLimit (15 MB).
    client_max_body_size 15m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/ld+json
        image/svg+xml
        font/woff2;

    # --- Static frontend ---
    root /var/www/midnightpick;   # repo root copied here (without backend/)
    index index.html;

    # Long cache for versioned/static assets (Cloudflare caches these at the edge).
    location /vendor/ { expires 1y;  add_header Cache-Control "public, immutable"; }
    location /build/  { expires 1y;  add_header Cache-Control "public, immutable"; }
    location /assets/ { expires 30d; add_header Cache-Control "public"; }
    location /font/   { expires 30d; add_header Cache-Control "public"; }
    # Admin-uploaded product images live on disk here.
    location /uploads/ { expires 7d; add_header Cache-Control "public"; }

    # --- Backend API ---
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # $remote_addr is the REAL client IP thanks to cloudflare-realip.conf.
        # Overwrite (don't append) XFF so the app sees exactly one trusted hop.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- Steadfast webhooks ---
    location /webhooks/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location /health { proxy_pass http://127.0.0.1:3000; access_log off; }

    # Frontend fallback — serve the matching .html, else index.html.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
